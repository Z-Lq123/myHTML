<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0e14">
  <title>项目导航</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  <div class="app">

    <!-- ========== 顶部 ========== -->
    <header class="home-header">
      <div>
        <h1 class="home-title">项目导航</h1>
        <p class="home-subtitle">本地存储的个人项目与工具索引</p>
      </div>
      <button class="btn pri" id="btnNew" type="button">+ 新建项目</button>
    </header>

    <!-- ========== 主体 ========== -->
    <main class="home-main">

      <!-- 工具栏 -->
      <div class="home-toolbar">
        <input class="input home-search" id="search" type="search"
               placeholder="搜索名称或描述…" autocomplete="off">
        <span class="home-count" id="count">共 0 个</span>
      </div>

      <!-- 分类筛选 -->
      <div class="home-filters" id="filters" role="group" aria-label="分类筛选"></div>

      <!-- 项目网格 -->
      <div class="home-grid" id="grid"></div>

      <!-- 空状态 -->
      <div class="home-empty" id="empty" hidden>
        <div>
          <p>还没有匹配的项目</p>
          <p class="u-tiny u-mute">试试调整搜索词或分类</p>
        </div>
      </div>

    </main>

    <!-- ========== 页脚 ========== -->
    <footer class="home-footer">
      数据保存在浏览器本地 · <code>localStorage</code>
    </footer>

  </div>

  <script>
  (function () {
    'use strict';

    /* ---------- 数据 ---------- */
    const KEY = 'nav.projects.v1';
    const CATS = ['全部', '工具', '游戏', '学习', '其他'];

    const seed = [
      { id: 'p1', name: '函数闯关', desc: '以函数为核心玩法的独立游戏原型', cat: '游戏', emoji: '', tags: ['Godot', 'GDScript'] },
      { id: 'p2', name: '组件库', desc: '可复用的前端 UI 组件与样式规范', cat: '工具', emoji: '', tags: ['CSS', '组件'] },
      { id: 'p3', name: '数学笔记', desc: '高一预科知识点梳理与错题归档', cat: '学习', emoji: '', tags: ['函数', '集合'] },
      { id: 'p4', name: '脚本合集', desc: '日常用的自动化小脚本', cat: '其他', emoji: '️', tags: ['JS'] }
    ];

    let projects = load();
    let activeCat = '全部';
    let keyword = '';

    /* ---------- 存取 ---------- */
    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr) && arr.length) return arr;
        }
      } catch (e) { /* 忽略解析错误 */ }
      localStorage.setItem(KEY, JSON.stringify(seed));
      return seed.slice();
    }
    function save() {
      localStorage.setItem(KEY, JSON.stringify(projects));
    }

    /* ---------- 渲染 ---------- */
    const $grid = document.getElementById('grid');
    const $empty = document.getElementById('empty');
    const $count = document.getElementById('count');
    const $filters = document.getElementById('filters');

    function renderFilters() {
      $filters.innerHTML = CATS.map(c => `
        <button class="home-filter" type="button"
                data-cat="${c}"
                aria-pressed="${c === activeCat}">${c}</button>
      `).join('');
    }

    function renderGrid() {
      const list = projects.filter(p => {
        const okCat = activeCat === '全部' || p.cat === activeCat;
        const kw = keyword.trim().toLowerCase();
        const okKw = !kw ||
          (p.name || '').toLowerCase().includes(kw) ||
          (p.desc || '').toLowerCase().includes(kw) ||
          (p.tags || []).some(t => t.toLowerCase().includes(kw));
        return okCat && okKw;
      });

      $grid.innerHTML = list.map(p => `
        <a class="home-card" href="project.html?id=${encodeURIComponent(p.id)}">
          <div class="home-card__thumb">${p.emoji || ''}</div>
          <h3 class="home-card__name">${esc(p.name)}</h3>
          <p class="home-card__desc">${esc(p.desc || '暂无描述')}</p>
          <div class="home-card__tags">
            ${(p.tags || []).map(t => `<span class="home-tag">${esc(t)}</span>`).join('')}
          </div>
        </a>
      `).join('');

      $count.textContent = `共 ${list.length} 个`;
      $empty.hidden = list.length > 0;
      $grid.hidden = list.length === 0;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    /* ---------- 事件 ---------- */
    $filters.addEventListener('click', e => {
      const btn = e.target.closest('.home-filter');
      if (!btn) return;
      activeCat = btn.dataset.cat;
      renderFilters();
      renderGrid();
    });

    document.getElementById('search').addEventListener('input', e => {
      keyword = e.target.value;
      renderGrid();
    });

    document.getElementById('btnNew').addEventListener('click', () => {
      const name = prompt('项目名称：');
      if (!name || !name.trim()) return;
      const p = {
        id: 'p' + Date.now(),
        name: name.trim(),
        desc: '',
        cat: activeCat === '全部' ? '其他' : activeCat,
        emoji: '',
        tags: []
      };
      projects.unshift(p);
      save();
      renderGrid();
    });

    /* ---------- 启动 ---------- */
    renderFilters();
    renderGrid();
  })();
  </script>
</body>
</html>
