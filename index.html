<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0e14">
  <title>项目导航</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  <div class="app">

    <!-- ========== 顶部 ========== -->
    <header class="home-header">
      <div>
        <h1 class="home-title">项目导航</h1>
        <p class="home-subtitle">个人项目与工具的索引</p>
      </div>
    </header>

    <!-- ========== 主体 ========== -->
    <main class="home-main">

      <!-- 工具栏 -->
      <div class="home-toolbar">
        <input class="input home-search" id="search" type="search"
               placeholder="搜索名称、描述或标签…" autocomplete="off">
        <span class="home-count" id="count">共 0 个</span>
      </div>

      <!-- 标签筛选 -->
      <div class="home-filters" id="filters" role="group" aria-label="标签筛选"></div>

      <!-- 项目网格 -->
      <div class="home-grid" id="grid"></div>

      <!-- 空状态 -->
      <div class="home-empty" id="empty" hidden>
        <div>
          <p>还没有匹配的项目</p>
          <p class="u-tiny u-mute">试试调整搜索词或标签</p>
        </div>
      </div>

    </main>

    <!-- ========== 页脚 ========== -->
    <footer class="home-footer">
      项目数据来自仓库根目录的 <code>projects.json</code>
    </footer>

  </div>

  <script>
  (function () {
    'use strict';

    /* ---------- 配置 ---------- */
    const DATA_URL = 'projects.json';   // 手动维护的项目清单

    let all = [];           // 全部项目（来自 projects.json）
    let activeTag = '全部'; // 当前选中标签
    let keyword = '';       // 搜索关键词

    /* ---------- DOM ---------- */
    const $grid = document.getElementById('grid');
    const $empty = document.getElementById('empty');
    const $count = document.getElementById('count');
    const $filters = document.getElementById('filters');

    /* ---------- 数据加载 ---------- */
    async function load() {
      try {
        const res = await fetch(DATA_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const arr = await res.json();
        all = Array.isArray(arr) ? arr : [];
      } catch (e) {
        all = [];
        console.error('projects.json 加载失败：', e);
      }
      renderFilters();
      renderGrid();
    }

    /* ---------- 标签收集 ---------- */
    function allTags() {
      const set = new Set();
      all.forEach(p => (p.tags || []).forEach(t => set.add(t)));
      return ['全部', ...Array.from(set)];
    }

    /* ---------- 渲染筛选 ---------- */
    function renderFilters() {
      $filters.innerHTML = allTags().map(t => `
        <button class="home-filter" type="button"
                data-tag="${esc(t)}"
                aria-pressed="${t === activeTag}">${esc(t)}</button>
      `).join('');
    }

    /* ---------- 渲染网格 ---------- */
    function renderGrid() {
      const kw = keyword.trim().toLowerCase();
      const list = all.filter(p => {
        const okTag = activeTag === '全部' || (p.tags || []).includes(activeTag);
        const okKw = !kw ||
          (p.name || '').toLowerCase().includes(kw) ||
          (p.desc || '').toLowerCase().includes(kw) ||
          (p.tags || []).some(t => t.toLowerCase().includes(kw));
        return okTag && okKw;
      });

      $grid.innerHTML = list.map(p => `
        <a class="home-card" href="${esc(p.path || '')}">
          <div class="home-card__thumb">${p.thumb ? `<img src="${esc(p.thumb)}" alt="${esc(p.name || '')}">` : ''}</div>
          <h3 class="home-card__name">${esc(p.name || '未命名')}</h3>
          <p class="home-card__desc">${esc(p.desc || '暂无描述')}</p>
          <div class="home-card__tags">
            ${(p.tags || []).map(t => `<span class="home-tag">${esc(t)}</span>`).join('')}
          </div>
        </a>
      `).join('');

      $count.textContent = `共 ${list.length} 个`;
      $empty.hidden = list.length > 0;
      $grid.hidden = list.length === 0;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    /* ---------- 事件 ---------- */
    $filters.addEventListener('click', e => {
      const btn = e.target.closest('.home-filter');
      if (!btn) return;
      activeTag = btn.dataset.tag;
      renderFilters();
      renderGrid();
    });

    document.getElementById('search').addEventListener('input', e => {
      keyword = e.value;
      renderGrid();
    });

    /* ---------- 启动 ---------- */
    renderFilters();
    load();
  })();
  </script>
</body>
</html>
